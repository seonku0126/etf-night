<header>

  <p class="tagline">미국장이 열린 밤, <b>내 해외 ETF는 지금 얼마일까?</b><br>밤사이 예상 가격과 큰손 움직임을 한눈에.</p>
  <div class="sub" id="status">불러오는 중…</div>
  <div class="search"><input id="q" placeholder="🔍 ETF 이름으로 검색 (예: 나스닥, S&P500)" autocomplete="off"><div class="results" id="res"></div></div>
</header>
<nav class="tabs"><button data-t="rank">순위</button><button data-t="cats">카테고리</button><button data-t="whale">큰손</button><button data-t="fav">관심</button></nav>

<footer>추정치이며 투자 권유가 아닙니다. 마감 iNAV, 구성종목 비중, 미국 시세, 원/달러 환율로 계산합니다. 미국 정규장이 닫혀 있을 때 큰 숫자는 지수 선물 움직임까지 반영한 값입니다. 밤 추정은 시가총액 상위 150개만 계산하고, 거래대금·등락률은 한국 장 기준, 외국인 순매수는 전 거래일 기준입니다.</footer>
<script>
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let favs=store.get('favs',['133690','360750','381180']);
let META=null,DET={},LIST=[],DATA={};
let view={name:(t=>['rank','cats','whale','fav'].includes(t)?t:'rank')(store.get('tab2','rank'))},rankKey='nightUp',catSort='cap';
// ---------- 제휴 상품 자리 (토스쇼핑 쉐어링크) ----------
const ADS=[{img:'img/ad-charger.jpg',name:'맥도도 GaN 67W 케이블 일체형 2포트 충전기',desc:'케이블 챙길 필요 없이 바로 충전',url:'https://toss.shopping/_m/roX3Fs9A'}];
const adBig=()=>{const a=ADS[0];return `<div class="adbig"><a href="${a.url}" target="_blank" rel="sponsored noopener noreferrer"><img src="${a.img}" alt="" width="120" height="120"><div class="abt"><span class="adb">밤샘 투자자 추천템</span><b>${esc(a.name)}</b><span class="abd">${esc(a.desc)}</span><span class="abgo">토스쇼핑에서 보기 ›</span></div></a><div class="disc">이 포스팅은 토스쇼핑 쉐어링크 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</div></div>`};
const adSlot=()=>`<div class="ad">${ADS.map(a=>`<a class="adc" href="${a.url}" target="_blank" rel="sponsored noopener noreferrer"><img src="${a.img}" alt="" loading="lazy" width="76" height="76"><div class="adt"><span class="adb">추천템</span><b>${esc(a.name)}</b><span>${esc(a.desc)}</span></div><span class="adgo">보러가기 ›</span></a>`).join('')}<div class="disc">이 포스팅은 토스쇼핑 쉐어링크 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</div></div>`;
const won=v=>v==null?'-':Math.round(v).toLocaleString('ko-KR')+'원';
const sign=v=>v==null?'':(v>0?'+':'')+v.toFixed(2)+'%';
const cls=v=>v==null?'flat':v>0.005?'up':v<-0.005?'down':'flat';
const hm=iso=>{if(!iso)return'-';const d=new Date(iso);return d.toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eok=v=>v==null?'-':(Math.abs(v)>=1e4?(v/1e4).toFixed(1)+'조':Math.round(v).toLocaleString('ko-KR')+'억');

// ---------- 카테고리 (이름 규칙, 위에서부터 먼저 맞는 것) ----------
const CATS=[
 ['lev','레버리지·인버스',/레버리지|인버스|2X|곱버스/i],
 ['cc','커버드콜·월배당',/커버드콜|프리미엄|인컴|월배당|타겟데일리/],

const catOf=n=>{for(const [k,,re] of CATS) if(re.test(n)) return k; return 'etc'};

function load(code){if(DET[code])DATA[code]={...DET[code],code};else if(META)DATA[code]={error:'이 ETF는 아직 밤 추정 목록(시가총액 상위 150개)에 없어요',code};}
const M=code=>LIST.find(x=>x.code===code)||{};

// ---------- 공통 목록 줄 ----------
function pctTag(p,lab){if(p==null)return '<span class="pt flat">-</span>';const c=cls(p),ar=p>0.005?'▲':p<-0.005?'▼':'';return `<span class="pt ${c}">${lab?`<em>${lab}</em>`:''}${ar}${Math.abs(p).toFixed(2)}%</span>`}
function li(x,i,o){
  o=o||{};const night=x.est!=null&&o.mode!=='today';
  const subs=[];
  if(night)subs.push(`종가 <b>${won(x.price)}</b>`);
  subs.push(`거래대금 <b>${eok((x.amt||0)/100)}</b>`);
  if(o.extra)subs.push(o.extra);
  if(o.mode==='today'&&x.est!=null)subs.push(`마감 후 <b class="${cls(x.pct)}">${sign(x.pct)}</b>`);
  const no=i!=null?`<div class="no${i<3?' top':''}">${i+1}</div>`:'';
  const right=night
    ?`<div class="r"><div class="np ${cls(x.pct)}">${arrow(x.pct)}${Math.abs(x.pct).toFixed(2)}%</div><div class="ns">예상 ${won(x.est)}</div></div>`
    :`<div class="r"><div class="v">${won(x.price)}</div>${pctTag(x.ch,'오늘')}</div>`;
  return `<div class="li" onclick="openD('${x.code}')">${no}<div class="l"><div class="nm">${esc(x.name)}</div><div class="s">${subs.join(' · ')}</div></div>${right}</div>`;
}
const arrow=p=>p>0.005?'▲':p<-0.005?'▼':'';
function nightBanner(){
  const g=k=>{const a=LIST.filter(x=>x.cat===k&&x.pct!=null&&!x.w&&!/레버리지|인버스|\(H\)/.test(x.name));return a.length?a.reduce((s,x)=>s+x.pct,0)/a.length:null};
  const all=LIST.filter(x=>x.pct!=null&&!x.w&&!/레버리지|인버스/.test(x.name));
  const up=all.filter(x=>x.pct>0.005).length,dn=all.filter(x=>x.pct<-0.005).length;
  const box=(n,v)=>`<div class="nb"><span>${n}</span><b class="${cls(v)}">${v==null?'-':arrow(v)+Math.abs(v).toFixed(2)+'%'}</b></div>`;
  return `<div class="banner"><div class="bt">🌙 한국 장 마감 후 지금까지</div><div class="nbs">${box('나스닥100 ETF',g('ndx'))}${box('S&P500 ETF',g('spx'))}${box('반도체 ETF',g('semi'))}</div><div class="bs"><span class="up">▲ ${up}개</span> 오름 · <span class="down">▼ ${dn}개</span> 내림 · 마감 iNAV 대비</div></div>`;
}


// ---------- 내 잔고 (계정에 저장, 실패하면 이 기기에만) ----------
let PF=store.get('pf',{items:[],cash:0}),pfDoc=null,pfSaving=Promise.resolve(),pfForm=null;
const PAL=['#f5c542','#5ab0ff','#ff7a7a','#7ee2a8','#c39bff','#ffa25c','#5fd4d4','#e58ad8','#9aa3b2'];
const sw=v=>(v>0?'+':v<0?'−':'')+Math.abs(Math.round(v)).toLocaleString('ko-KR')+'원';
function priceNow(code){const m=M(code);return m.est!=null?{px:m.est,src:'밤 추정'}:{px:m.price,src:'종가'}}
function persist(){store.set('pf',PF);if(pfDoc){const data={items:PF.items,cash:+PF.cash||0,updatedAt:new Date().toISOString()};pfSaving=pfSaving.then(()=>pfDoc.set(data)).catch(()=>{pfDoc=null})}}
function pfView(){
  if(pfForm)return formView();
  const rows=PF.items.map((it,i)=>{const m=M(it.code),pn=priceNow(it.code),px=pn.px||it.avg,last=(m.price||px);
    return {...it,i,m,src:pn.src,val:px*it.qty,cost:it.avg*it.qty,night:(px-last)*it.qty}}).sort((a,b)=>b.val-a.val);
  const cash=+PF.cash||0,stock=rows.reduce((a,r)=>a+r.val,0),total=stock+cash,cost=rows.reduce((a,r)=>a+r.cost,0);
  const pnl=stock-cost,night=rows.reduce((a,r)=>a+r.night,0),lastTotal=total-night;
  const segs=rows.map((r,k)=>({n:r.m.name||r.code,w:total?r.val/total:0,c:PAL[k%PAL.length]})).concat(cash>0?[{n:'예수금',w:cash/total,c:'#3a3f4b'}]:[]);
  const sum=`<div class="card">
    <div class="meta" style="margin-top:0">내 잔고 · 추정</div>
    <div class="big" style="font-size:30px">${won(total)}</div>
    <div class="sumrow"><span>오늘 밤 예상 변동</span><span class="pct ${cls(night)}">${sw(night)} (${sign(lastTotal?night/lastTotal*100:0)})</span></div>
    <div class="sumrow"><span>총 손익 (투자원금 ${won(cost)})</span><span class="pct ${cls(pnl)}">${sw(pnl)} (${sign(cost?pnl/cost*100:0)})</span></div>
    ${total?`<div class="bar">${segs.map(g=>`<i style="width:${(g.w*100).toFixed(2)}%;background:${g.c}"></i>`).join('')}</div>
    <div class="legend">${segs.map(g=>`<span><b style="background:${g.c}"></b>${esc(g.n.replace(/^(TIGER|KODEX|ACE|RISE|SOL|TIME|PLUS|KIWOOM|HANARO|KoAct|WON) /,''))} ${(g.w*100).toFixed(1)}%</span>`).join('')}</div>`:''}
  </div>`;
  const cashRow=`<div class="li" onclick="openCash()"><div class="l"><div class="nm">예수금</div><div class="s">눌러서 수정</div></div><div class="r"><div class="v">${won(cash)}</div></div></div>`;
  const list=rows.length?`<div class="list">${rows.map(r=>`<div class="li" onclick="openForm(${r.i})">
     <div class="l"><div class="nm">${esc(r.m.name||r.code)}</div><div class="s">${r.qty.toLocaleString('ko-KR')}주 · 평균 ${won(r.avg)} · ${r.src} ${won(r.val/r.qty)}</div></div>
     <div class="r"><div class="v">${won(r.val)}</div><div class="p ${cls(r.val-r.cost)}">${sign(r.cost?(r.val-r.cost)/r.cost*100:0)}</div></div>
     <div class="ed"><button onclick="event.stopPropagation();openForm(${r.i})">수정</button><button class="del" onclick="event.stopPropagation();delItem(${r.i})">삭제</button></div></div>`).join('')}
     ${cashRow}</div>`
    :`<div class="empty">보유한 ETF를 추가하면 잔고를 계산해 드려요</div><div class="list">${cashRow}</div>`;
  const ub=undo?`<div class="undo"><span>${esc(M(undo.it.code).name||undo.it.code)} 삭제됨</span><button onclick="undoDel()">되돌리기</button></div>`:'';
  return ub+sum+list+`
    <button class="btn" onclick="openForm(null)">+ 종목 추가</button>
    <div class="note" style="margin-top:10px">가격은 밤 추정값(시가총액 상위 150개) 또는 마지막 종가를 써요. ${pfDoc?'Claude 계정에 저장돼 다른 기기에서도 보여요.':'이 기기에만 저장돼요.'}</div>`+adSlot();
}
function formView(){
  if(pfForm.mode==='cash')return `<div class="form"><b>예수금</b><label>금액(원)</label><input id="f_cash" type="number" inputmode="numeric" value="${PF.cash||''}">
    <div class="acts"><button style="background:var(--line);color:var(--ink)" onclick="closeForm()">취소</button><button style="background:var(--acc);color:#111" onclick="saveCash()">저장</button></div></div>`;
  const m=M(pfForm.code);
  return `<div class="form"><b>${pfForm.idx!=null?'종목 수정':'종목 추가'}</b>
    <label>ETF</label><input id="f_q" placeholder="이름이나 종목코드" value="${esc(m.name||'')}" oninput="pickList(this.value)" autocomplete="off"><div class="pick" id="f_pick"></div>
    <label>보유 수량(주)</label><input id="f_qty" type="number" inputmode="decimal" value="${pfForm.qty||''}">
    <label>평균 매수가(원)</label><input id="f_avg" type="number" inputmode="decimal" value="${pfForm.avg||''}">
    <div class="meta" id="f_msg"></div>
    <div class="acts"><button style="background:var(--line);color:var(--ink)" onclick="closeForm()">취소</button>${pfForm.idx!=null?`<button style="background:#3a1f22;color:var(--up)" onclick="delItem(${pfForm.idx})">삭제</button>`:''}<button style="background:var(--acc);color:#111" onclick="saveForm()">저장</button></div></div>`;
}
function openForm(i){const it=i!=null?PF.items[i]:null;pfForm={idx:i,code:it?it.code:'',qty:it?it.qty:'',avg:it?it.avg:''};render();scrollTo(0,0)}
function closeForm(){pfForm=null;render()}
function openCash(){pfForm={mode:'cash'};render();scrollTo(0,0)}
function pickList(q){const box=$('#f_pick');q=q.trim().toLowerCase().replace(/\s/g,'');if(!q){box.style.display='none';return}
  const hit=LIST.filter(x=>x.code.toLowerCase().includes(q)||x.name.toLowerCase().replace(/\s/g,'').includes(q)).slice(0,20);
  box.innerHTML=hit.map(x=>`<div onclick="pickIt('${x.code}')"><span>${esc(x.name)}</span><small>${won(x.price)}</small></div>`).join('')||'<div><small>검색 결과가 없어요</small></div>';box.style.display='block'}
function pickIt(code){pfForm.code=code;const m=M(code);$('#f_q').value=m.name;$('#f_pick').style.display='none';if(!$('#f_avg').value)$('#f_avg').value=m.price||''}
function saveForm(){const qty=+$('#f_qty').value,avg=+$('#f_avg').value;
  if(!pfForm.code){$('#f_msg').textContent='ETF를 목록에서 골라주세요';return}
  if(!(qty>0)||!(avg>0)){$('#f_msg').textContent='수량과 평균 매수가를 넣어주세요';return}
  const it={code:pfForm.code,qty,avg};
  if(pfForm.idx!=null)PF.items[pfForm.idx]=it;else{const j=PF.items.findIndex(x=>x.code===it.code);if(j>=0){const o=PF.items[j],q2=o.qty+qty;PF.items[j]={code:it.code,qty:q2,avg:(o.avg*o.qty+avg*qty)/q2}}else PF.items.push(it)}
  persist();pfForm=null;render()}
function saveCash(){PF.cash=Math.max(0,+$('#f_cash').value||0);persist();pfForm=null;render()}
let undo=null,undoT=null;
function delItem(i){const it=PF.items[i];if(!it)return;PF.items.splice(i,1);persist();pfForm=null;undo={it,i};clearTimeout(undoT);undoT=setTimeout(()=>{undo=null;render()},5000);render()}
function undoDel(){if(!undo)return;PF.items.splice(Math.min(undo.i,PF.items.length),0,undo.it);undo=null;clearTimeout(undoT);persist();render()}

function favView(){return (favs.length?favs.map(c=>(load(c),card(c))).join(''):'<div class="empty">ETF를 검색하거나 카테고리에서 골라 담아보세요</div>')+adSlot()}
function catsView(){
  const g={};for(const x of LIST)(g[x.cat]=g[x.cat]||[]).push(x);
  return `<div class="note">분류를 누르면 시가총액 순으로 쭉 볼 수 있어요</div><div class="grid">`+CATS.filter(c=>g[c[0]]).map(([k,n])=>{
    const xs=g[k],ok=xs.filter(x=>x.pct!=null),avg=ok.length?ok.reduce((a,x)=>a+x.pct,0)/ok.length:null;
    return `<div class="cat" onclick="openCat('${k}')"><b>${n}</b><span>${xs.length}개</span>${avg!=null?` <span class="pct ${cls(avg)}">밤 예상 평균 ${sign(avg)}</span>`:''}</div>`}).join('')+'</div>'+adSlot();
}
function catView(k){
  let xs=LIST.filter(x=>x.cat===k);
  const S={cap:(a,b)=>(b.cap||0)-(a.cap||0),night:(a,b)=>(b.pct??-1e9)-(a.pct??-1e9),today:(a,b)=>(b.ch??-1e9)-(a.ch??-1e9),amt:(a,b)=>(b.amt||0)-(a.amt||0)};
  xs=xs.slice().sort(S[catSort]);
  const seg=[['cap','시가총액'],['night','마감 후 등락'],['today','오늘 등락'],['amt','거래대금']].map(([k2,n])=>`<button class="${catSort===k2?'on':''}" onclick="catSort='${k2}';render()">${n}</button>`).join('');
  return `<button class="back" onclick="go('cats')">← 카테고리</button><div class="ttl"><b>${catName(k)}</b><span class="s">${xs.length}개</span></div><div class="seg">${seg}</div><div class="list">${xs.map((x,i)=>li(x,null,catSort==='today'?{mode:'today'}:{})).join('')}</div>${adSlot()}`;
}
const RANKS=[
 ['nightUp','🌙 마감 후 상승',x=>x.pct,1,x=>({})],
 ['nightDown','🌙 마감 후 하락',x=>x.pct,-1,x=>({})],
 ['amt','💰 거래대금',x=>x.amt,1,x=>({})],
 ['todayUp','🔺 오늘 급상승',x=>x.ch,1,x=>({mode:'today'})],
 ['todayDown','🔻 오늘 급하락',x=>x.ch,-1,x=>({mode:'today'})],
 ['fbuy','🌏 외국인 순매수',x=>x.fb,1,x=>({extra:`외국인 <b class="up">+${eok(x.fb)}</b>`})],
 ['fsell','🌏 외국인 순매도',x=>x.fb,-1,x=>({extra:`외국인 <b class="down">${eok(x.fb)}</b>`})],
];
function rankView(){
  const [k,n,f,dir,right]=RANKS.find(r=>r[0]===rankKey);

   ${d.session==='closed'?`<div class="meta">공식 iNAV 방식(정규장 종가) ${won(d.estReg)} <span class="${cls(d.pctReg)}">${sign(d.pctReg)}</span>${d.inavLive?` · 지금 공식 iNAV ${won(d.inavLive)}`:''}</div>`:''}
   <div class="meta">미국 시세 ${hm(d.pricedAt)} · ${esc(d.method)}${d.check?` · 어제 추정 오차 ${(d.check.errBp/100>0?'+':'')+(d.check.errBp/100).toFixed(2)}%`:''}</div></div>`;

   <div class="meta">${d.navDate} 마감 iNAV 대비 추정${d.session==='closed'?' · 미국장이 닫혀 있어 선물 움직임까지 반영(예상 시가에 가까운 값)':''}</div>
   ${d.session==='closed'?`<div class="kv">
    <div><span>공식 iNAV 방식(정규장 종가)</span><b>${won(d.estReg)} <small class="${cls(d.pctReg)}">${sign(d.pctReg)}</small></b></div>
    <div><span>애프터·프리마켓 가격 반영</span><b>${won(d.estAh)} <small class="${cls(d.pctAh)}">${sign(d.pctAh)}</small></b></div>
    ${d.inavLive?`<div><span>지금 공식 iNAV</span><b>${won(d.inavLive)}</b></div>`:''}
    <div><span>${d.futSym==='NQ=F'?'나스닥100':d.futSym==='ES=F'?'S&amp;P500':'다우'} 선물(정규장 마감 후)</span><b class="${cls(d.futPct)}">${sign(d.futPct)}</b></div>
   </div>`:''}
   ${(d.notes||[]).map(n=>`<div class="meta">· ${esc(n)}</div>`).join('')}
   <div class="kv">
    <div><span>미국 자산 등락(달러)</span><b class="${cls(d.rUsd)}">${sign(d.rUsd)}</b></div>
    <div><span>환율 효과${d.hedged?' (환헤지)':''}</span><b class="${cls(d.fxPct)}">${sign(d.fxPct)}</b></div>
    <div><span>지금 원/달러</span><b>${d.fxNow?d.fxNow.toFixed(1):'-'}</b></div>
    <div><span>기준값에 쓰인 환율(${d.fxDate||'-'} 15:30)</span><b>${d.fxBase?d.fxBase.toFixed(1):'-'}</b></div>
    <div><span>마지막 종가 대비</span><b class="${cls(d.vsPrice)}">${sign(d.vsPrice)}</b></div>
    <div><span>시세 반영 비중</span><b>${d.method.startsWith('지수')?'지수 사용':d.coverage+'%'}</b></div>
    <div><span>어제 같은 방식 추정 오차</span><b>${d.check?(d.check.errBp/100>0?'+':'')+(d.check.errBp/100).toFixed(2)+'%':'-'}</b></div>
    <div><span>어제 추정 / 실제 NAV</span><b>${d.check?won(d.check.guess)+' / '+won(d.nav):'-'}</b></div>
   </div>
   <div class="chip">${esc(d.method)} · 구성종목 ${d.nHold}개 · 원화 ${d.wKrw}%</div>
   <div class="chip">미국 시세 ${hm(d.pricedAt)} · 계산 ${hm(d.at)}</div>
   ${rows?`<table><tr><td class="meta">많이 움직인 종목</td><td class="meta">비중</td><td class="meta">등락</td></tr>${rows}</table>`:''}
  </div>`;
}


// ---------- 큰손 추적 ----------
function applyWH(){if(!WH)return;for(const x of LIST){const w=WH.items[x.code];if(w&&w.f1!=null){x.fb=w.f1;x.fbd=WH.day}}}
let WH=null,whKey='flow',whPer='1';
const ek=v=>v==null?'-':(v>0?'+':'')+(Math.abs(v)>=1e4?(v/1e4).toFixed(2)+'조':Math.abs(v)>=10?Math.round(v).toLocaleString('ko-KR')+'억':v.toFixed(1)+'억');
const md=d=>d?(+d.slice(4,6))+'/'+(+d.slice(6)):'';
const WHK=[
 ['flow','💰 자금 유입','설정·환매로 실제 새로 들어온 돈 (순자산 변화 − 수익)',w=>w['fl'+whPer],1],
 ['out','💸 자금 유출','환매로 빠져나간 돈',w=>w['fl'+whPer],-1],
 ['fbuy','🌏 외국인 매수','외국인 순매수 금액',w=>w['f'+whPer],1],
 ['fsell','🌏 외국인 매도','외국인 순매도 금액',w=>w['f'+whPer],-1],
 ['obuy','🏦 기관 매수','기관 순매수 금액',w=>w['o'+whPer],1],
 ['osell','🏦 기관 매도','기관 순매도 금액',w=>w['o'+whPer],-1],
 ['fstreak','🔥 외국인 연속','외국인 연속 순매수 일수',w=>w.fs,1],
 ['ostreak','🔥 기관 연속','기관 연속 순매수 일수',w=>w.os,1],
 ['flstreak','🔥 유입 연속','자금 연속 유입 일수',w=>w.fls,1],
 ['vol','⚡ 거래 폭증','오늘 거래량 ÷ 최근 20일 평균 (거래대금 10억 이상)',w=>w.vx,1],
];
function whTags(w){const t=[];
  if(w.fs>=3)t.push(`<span class="tg up">외인 ${w.fs}일 연속 매수</span>`);else if(w.fs<=-3)t.push(`<span class="tg down">외인 ${-w.fs}일 연속 매도</span>`);
  if(w.os>=3)t.push(`<span class="tg up">기관 ${w.os}일 연속 매수</span>`);else if(w.os<=-3)t.push(`<span class="tg down">기관 ${-w.os}일 연속 매도</span>`);
  if(w.fls>=3)t.push(`<span class="tg up">자금 ${w.fls}일 연속 유입</span>`);else if(w.fls<=-3)t.push(`<span class="tg down">자금 ${-w.fls}일 연속 유출</span>`);
  if(w.vx>=3)t.push(`<span class="tg acc">거래량 ${w.vx}배</span>`);return t.join('')}
function whaleView(){
  if(!WH)return '<div class="empty">큰손 데이터를 불러오는 중…</div>';
  const [k,n,note,f,dir]=WHK.find(r=>r[0]===whKey);const I=WH.items;
  let xs=LIST.filter(x=>I[x.code]&&f(I[x.code])!=null);
  if(k==='vol')xs=xs.filter(x=>(x.amt||0)>=1000);
  xs=xs.filter(x=>dir*f(I[x.code])>0).sort((a,b)=>dir*(f(I[b.code])-f(I[a.code]))).slice(0,50);
  const isStreak=k.includes('streak'),isVol=k==='vol';
  const seg=WHK.map(r=>`<button class="${whKey===r[0]?'on':''}" onclick="whKey='${r[0]}';render()">${r[1]}</button>`).join('');
  const per=(isStreak||isVol)?'':`<div class="seg sm">${[['1','하루'],['5','5일'],['20','20일']].map(([v,l])=>`<button class="${whPer===v?'on':''}" onclick="whPer='${v}';render()">${l}</button>`).join('')}</div>`;
  const day=k.startsWith('f')&&!k.startsWith('fl')||k.startsWith('o')||k==='fstreak'||k==='ostreak'?md(WH.day):md(WH.day);
  const rows=xs.map((x,i)=>{const w=I[x.code],v=f(w);
    const main=isStreak?`${v}일`:isVol?`${v}배`:ek(v);
    const sub=isVol?`오늘 거래대금 ${eok(x.amt/100)}`:`외인 ${ek(w.f1)} · 기관 ${ek(w.o1)} · 자금 ${ek(w.fl1)}`;
    return `<div class="li" onclick="openD('${x.code}')"><div class="no">${i+1}</div>
      <div class="l"><div class="nm">${esc(x.name)}</div><div class="s">${sub}</div><div class="tgs">${whTags(w)}</div></div>
      <div class="r"><div class="v ${isVol?'':cls(dir*Math.abs(v)*(dir))}">${main}</div><div class="p ${cls(x.ch)}"><span class="s" style="font-weight:400">오늘 </span>${sign(x.ch)}</div></div></div>`}).join('');
  return `${adBig()}<div class="seg wrap">${seg}</div>${per}<div class="note">${note}${isStreak||isVol?'':` · ${whPer==='1'?'하루':'최근 '+whPer+'거래일 합계'}`} · ${day} 기준 · 상위 ${xs.length}개</div>
   <div class="list">${rows||'<div class="empty">해당하는 ETF가 없어요</div>'}</div>
   <div class="note" style="margin-top:10px">외국인·기관 순매수는 수량 × 그날 종가로 계산한 추정 금액이에요. 자금 유입은 순자산 변화에서 운용 수익을 뺀 값이라 분배금 지급일 등에는 오차가 있어요. 매일 저녁 갱신.</div>`;
}
function whaleBox(c){const w=WH&&WH.items[c];if(!w)return '';
  const bars=(arr,lab)=>{if(!arr||!arr.length)return '';const mx=Math.max(...arr.map(Math.abs),0.1);
    return `<div class="wb"><div class="wbl">${lab}</div><div class="wbr">${arr.slice().reverse().map(v=>{const h=Math.max(2,Math.abs(v)/mx*34);return `<div class="wc"><div class="wt">${v>0?`<i class="up" style="height:${h}px"></i>`:''}</div><div class="wd">${v<0?`<i class="down" style="height:${h}px"></i>`:''}</div></div>`}).join('')}</div></div>`};
  const fo=w.fo||[];
  return `<div class="card"><b>🐋 큰손 동향</b> <span class="meta">${md(w.d)} 기준</span>
   <div class="kv" style="margin-top:8px">
    <div><span>외국인 하루 / 5일 / 20일</span><b>${ek(w.f1)} / ${ek(w.f5)} / ${ek(w.f20)}</b></div>
    <div><span>기관 하루 / 5일 / 20일</span><b>${ek(w.o1)} / ${ek(w.o5)} / ${ek(w.o20)}</b></div>
    <div><span>자금 유입 하루 / 5일 / 20일</span><b>${ek(w.fl1)} / ${ek(w.fl5)} / ${ek(w.fl20)}</b></div>
    <div><span>개인 하루</span><b>${ek(w.i1)}</b></div></div>
   <div class="tgs" style="margin-top:8px">${whTags(w)||'<span class="meta">눈에 띄는 연속 매매 없음</span>'}</div>
   <div class="meta" style="margin-top:10px">최근 10거래일 (왼쪽이 과거)</div>
   ${bars(fo.map(x=>x[0]),'외국인')}${bars(fo.map(x=>x[1]),'기관')}${bars(w.fh,'자금 유입')}</div>`;
}

function render(){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===(view.tab||view.name)));
  let h='';
  if(!META)h='<div class="empty">불러오는 중…</div>';
  else if(view.name==='fav')h=favView();
  else if(view.name==='cats')h=catsView();
  else if(view.name==='cat')h=catView(view.key);
  else if(view.name==='rank')h=rankView();
  else if(view.name==='whale')h=whaleView();
  else if(view.name==='detail'){
    load(view.code);const c=view.code,m=M(c),d=DATA[c]||{};
    const fb=`<button class="x" style="color:var(--acc);float:right;margin-top:-2px" onclick="toggleFav('${c}')">${favs.includes(c)?'★ 관심 해제':'☆ 관심 담기'}</button>`;
    const info=`<div class="kv">
      <div><span>오늘 종가</span><b>${won(m.price)} <small class="${cls(m.ch)}">${sign(m.ch)}</small></b></div>
      <div><span>오늘 거래대금</span><b>${eok(m.amt/100)}</b></div>
      <div><span>외국인 순매수(${m.fbd?m.fbd.slice(4,6)+'/'+m.fbd.slice(6):'-'})</span><b class="${cls(m.fb)}">${m.fb==null?'-':(m.fb>0?'+':'')+eok(m.fb)}</b></div>
      <div><span>시가총액 · 분류</span><b>${eok(m.cap)} · ${catName(m.cat)}</b></div></div>`;
    if(d.error) h=`<button class="back" onclick="back()">← 목록</button>${fb}<div class="card detail"><div class="name">${esc(m.name||c)}<span class="code">${c}</span></div>${info}<div class="meta" style="margin-top:10px">${esc(d.error)}</div></div>`;
    else h=detail(c).replace('onclick="home()">← 목록</button>','onclick="back()">← 목록</button>'+fb).replace('<div class="kv">',info+'<div class="kv">');
  }
  if(view.name==='detail')h+=whaleBox(view.code);
  if(view.name==='detail'||view.name==='cat'){
    h=h.replace(/<button class="back"[^>]*>[^<]*<\/button>/g,'');
    let fav='';if(view.name==='detail'){const c=view.code;h=h.replace(/<button class="x" style="color:var\(--acc\);float:right;margin-top:-2px"[^>]*>[^<]*<\/button>/,'');fav=`<button class="tb-fav" onclick="toggleFav('${c}')">${favs.includes(c)?'★':'☆'}</button>`}
    const ttl=view.name==='cat'?catName(view.key):((LIST.find(x=>x.code===view.code)||{}).name||'');
    h=`<div class="topbar"><button class="tb-back" onclick="back()" aria-label="뒤로">‹</button><b>${esc(ttl)}</b>${fav}</div>`+h;
  }
  $('#main').innerHTML=h;
}
let prev=null;
let stack=[],scrolls=[];
function go(t){view={name:t};stack=[];scrolls=[];pfForm=null;store.set('tab2',t);render();scrollTo(0,0)}
function push(v){stack.push(view);scrolls.push(scrollY);view=v;try{history.pushState({d:stack.length},'')}catch(e){}render();scrollTo(0,0)}
function openCat(k){push({name:'cat',key:k,tab:'cats'})}
function openD(code){push({name:'detail',code,tab:view.tab||view.name})}
function popView(){if(!stack.length)return false;view=stack.pop();const y=scrolls.pop()||0;render();scrollTo(0,y);return true}
function back(){if(stack.length&&history.state&&history.state.d){history.back()}else if(!popView()){go('rank')}}
function home(){back()}
addEventListener('popstate',()=>{popView()});
function unfav(code,e){e.stopPropagation();favs=favs.filter(c=>c!==code);store.set('favs',favs);render()}
function toggleFav(code){favs=favs.includes(code)?favs.filter(c=>c!==code):[code,...favs];store.set('favs',favs);render()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.t));
document.addEventListener('touchstart',()=>{},{passive:true});
document.addEventListener('click',e=>{if(e.target.closest('button,.li,.cat')&&navigator.vibrate)try{navigator.vibrate(8)}catch(_){}} ,true);
$('#q').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase().replace(/\s/g,'');const box=$('#res');
  if(!q){box.style.display='none';return}
  const hit=LIST.filter(x=>x.code.toLowerCase().includes(q)||x.name.toLowerCase().replace(/\s/g,'').includes(q)).slice(0,30);
  box.innerHTML=hit.length?hit.map(x=>`<div onclick="pick('${x.code}')"><span>${esc(x.name)}</span><small>${won(x.price)}</small></div>`).join(''):'<div><small>검색 결과가 없어요</small></div>';
  box.style.display='block';
});
function pick(code){$('#q').value='';$('#res').style.display='none';openD(code)}
document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('#res').style.display='none'});
function status(){if(META){const d=new Date(META.at);$('#status').textContent='밤 추정 '+d.toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})+' 계산 · 22:40·02:40·06:40·08:40 자동 갱신'}}
(async()=>{
  render();
  const v=()=>'?t='+Math.floor(Date.now()/300000); // 5분 단위 캐시
  const get=async p=>{try{const r=await fetch('data/'+p+'.json'+v(),{cache:'no-cache'});return r.ok?await r.json():null}catch(e){return null}};
  async function load(){
    const [m,w]=await Promise.all([get('meta'),get('whale')]);const ds=m?await Promise.all(Array.from({length:Math.ceil((m.n||0)/50)},(_,k)=>get('d'+k))):[];
    if(!m){if(!META)$('#status').textContent='데이터를 불러오지 못했어요. 잠시 후 다시 열어주세요';return}
    META=m;LIST=(META.list||[]).map(x=>({code:x.c,name:x.n,price:x.p,cap:x.cap,ch:x.ch,amt:x.amt,fb:x.fb,fbd:x.fbd,est:x.est,pct:x.pct,pr:x.pr,w:x.w,cat:catOf(x.n)}));
    if(w)WH=w;DET={};for(const d of ds)if(d&&d.items)Object.assign(DET,d.items);DATA={};
    applyWH();status();render();
  }
  await load();
  const hm=location.hash.match(/^#etf=([0-9A-Z]{6})$/);if(hm&&LIST.some(x=>x.code===hm[1])){openD(hm[1]);history.replaceState(null,'',location.pathname)}
  setInterval(()=>{if(document.visibilityState==='visible')load()},300000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')load()});
})()
